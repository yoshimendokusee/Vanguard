name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub:
    name: Hub tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm test
      - name: JavaScript syntax and demo shell syntax
        run: |
          for file in *.js; do node --check "$file"; done
          bash -n ../fake-watch.sh

  watch:
    name: Watch analysis and parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      # Native build and speech/BLE hardware acceptance are not covered here.

  docker:
    name: Compose and container tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: git show --format= --check HEAD
      - run: docker compose config --quiet
      - run: docker compose -f hub/docker-compose.yml config --quiet
      - run: docker compose build
      - run: |
          docker compose run --rm --no-deps -e DB_PATH=:memory: hub npm test
