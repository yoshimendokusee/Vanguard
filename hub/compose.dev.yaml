services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3301:3301"
    environment:
      VITE_API_TARGET: http://hub:3000
      VITE_USE_POLLING: "${VITE_USE_POLLING:-true}"
    volumes:
      - ./public:/app/public:ro
      - ./vite.config.mjs:/app/vite.config.mjs:ro
    depends_on:
      hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3301/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
