# Synthetic acceptance only; separate named volumes, no hub/data mount.
services:
  hub:
    image: vanguard-qwen-qa:local
    volumes:
      - qwen-qa-reports:/data
      - ../models:/models:ro
    ports:
      - '127.0.0.1:3311:3000'
    environment:
      OLLAMA_URL: http://ollama:11434
      QWEN_MODEL_DIR: /models/qwen3-0.6b
      AI_TIMEOUT_MS: '120000'
    networks: [offline]
  ollama:
    image: ollama/ollama:0.11.4@sha256:be17b353bf3cfab0b6980530284e64716a57589ed753a82d9a6a2a5fa9a61a31
    pull_policy: never
    volumes:
      - qwen-qa-runtime:/root/.ollama
      - ../models/qwen3-0.6b:/models:ro
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: '1'
    entrypoint: ["/bin/sh", "/models/start-ollama.sh"]
    networks: [offline]
networks:
  offline:
    internal: true
volumes:
  qwen-qa-reports:
  qwen-qa-runtime:
